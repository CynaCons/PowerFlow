name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: pack checks (plan, decisions, req-ids, skills, versions) + guard tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install powerplan-mcp
      - name: check-plan mirror agrees with powerplan on our own PLAN.md (D13 gate)
        run: node templates/scripts/check-plan.mjs PLAN.md
      - name: Pack checks — check_plan, decisions, check-req-ids, skills, check-version (plugin/package/changelog), guard tests
        run: python scripts/check.py
      - name: Guard tests
        run: npm test
