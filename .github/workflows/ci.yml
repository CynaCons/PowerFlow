name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: plan · versions · guard tests · one skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install powerplan-mcp
      - name: Node mirror agrees with powerplan on our own PLAN.md (D13 gate)
        run: node extras/guards/check-plan.mjs PLAN.md
      - name: Requirement IDs (none yet) and version source, with the opt-in guards
        run: node extras/guards/check-req-ids.mjs --root . && node extras/guards/check-version.mjs --root . --changelog
      - name: check.py — check_plan, versions, guard tests, one skill
        run: python scripts/check.py
